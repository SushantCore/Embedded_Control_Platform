<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <rect width="1200" height="850" fill="#ffffff"/>
  <text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#172b4d">Embedded Control Platform</text>
  <text x="70" y="88" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526581">Software architecture | B-L4S5I-IOT01A | STM32L4S5VITx</text>
  <line x1="70" y1="112" x2="1130" y2="112" stroke="#d7dee8" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
    <rect x="190" y="145" width="820" height="130" rx="4" fill="#f7f9fc" stroke="#526581" stroke-width="2"/>
    <rect x="190" y="145" width="820" height="38" fill="#e8eef6" stroke="#526581" stroke-width="1.5"/>
    <text x="215" y="171" font-size="19" font-weight="700">APPLICATION</text>
    <text x="215" y="211" font-size="16">app.c | app.h</text>
    <text x="215" y="239" font-size="16">Command processing | LED control | PWM fade | SOS pattern | uptime</text>

    <rect x="190" y="340" width="820" height="130" rx="4" fill="#f7f9fc" stroke="#526581" stroke-width="2"/>
    <rect x="190" y="340" width="820" height="38" fill="#e8eef6" stroke="#526581" stroke-width="1.5"/>
    <text x="215" y="366" font-size="19" font-weight="700">MIDDLEWARE</text>
    <text x="215" y="406" font-size="16">Logging | logging.c</text>
    <text x="215" y="432" font-size="16">Error handling | error_handler.c</text>
    <text x="650" y="406" font-size="16">Configuration | config.c</text>
    <text x="650" y="432" font-size="14" fill="#526581">RAM key/value storage</text>

    <rect x="190" y="535" width="820" height="120" rx="4" fill="#f7f9fc" stroke="#526581" stroke-width="2"/>
    <rect x="190" y="535" width="820" height="38" fill="#e8eef6" stroke="#526581" stroke-width="1.5"/>
    <text x="215" y="561" font-size="19" font-weight="700">BARE-METAL DRIVERS</text>
    <text x="215" y="602" font-size="16">GPIO | USART1 UART | TIM2 timer | TIM15 PWM | NVIC/interrupts</text>
    <text x="215" y="629" font-size="15" fill="#526581">Peripheral setup and control through register-level operations</text>

    <rect x="190" y="720" width="820" height="90" rx="4" fill="#f7f9fc" stroke="#526581" stroke-width="2"/>
    <rect x="190" y="720" width="820" height="35" fill="#e8eef6" stroke="#526581" stroke-width="1.5"/>
    <text x="215" y="744" font-size="18" font-weight="700">MICROCONTROLLER HARDWARE + CMSIS DEVICE DEFINITIONS</text>
    <text x="215" y="779" font-size="16">STM32L4S5VITx peripheral registers | CMSIS register structures and IRQ declarations</text>
  </g>
  <g stroke="#526581" stroke-width="2.2" fill="#526581">
    <line x1="600" y1="276" x2="600" y2="330"/><polygon points="593,322 607,322 600,333"/>
    <line x1="600" y1="471" x2="600" y2="525"/><polygon points="593,517 607,517 600,528"/>
    <line x1="600" y1="656" x2="600" y2="710"/><polygon points="593,702 607,702 600,713"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526581">
    <text x="620" y="307">Uses middleware APIs</text>
    <text x="620" y="502">Middleware uses driver APIs</text>
    <text x="620" y="687">Drivers access registers</text>
    <text x="70" y="833">Note: The application also calls driver APIs directly for GPIO, UART, timer and PWM operations.</text>
  </g>
</svg>